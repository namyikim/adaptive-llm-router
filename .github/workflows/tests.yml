name: Unit tests (CPU)
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests without downloading models
        run: python -m unittest discover -s tests -v
      - name: Smoke-test no-API L2/L3 task export and no-execute patch default
        run: |
          PYTHONPATH=src python -m adaptive_llm_router.bugsinpy_blind_tasks \
            --source-audit benchmarks/data/bugsinpy_six_historical_reproductions.json \
            --output /tmp/bugsinpy-l2-l3-tasks.jsonl
          PYTHONPATH=src python -m adaptive_llm_router.bugsinpy_patch_verifier \
            --dataset-root /tmp/unused --workspace /tmp/unused \
            --output-root /tmp/bugsinpy-l2-l3-evaluation \
            --case-id tornado-7 --tier l2 --model-id pending-model
          PYTHONPATH=src python -m adaptive_llm_router.bugsinpy_patch_compare \
            --input-dir /tmp/bugsinpy-l2-l3-evaluation \
            --output /tmp/bugsinpy-l2-l3-evaluation/comparison.json
          python -c 'import json; p="/tmp/bugsinpy-l2-l3-evaluation/comparison.json"; d=json.load(open(p)); assert d["n_complete_pairs"] == 0 and d["overall_six_case_success_rates"] is None'
      - name: Validate pinned BugsInPy metadata in safe dry-run mode
        run: |
          git clone --depth 1 --quiet https://github.com/soarsmu/BugsInPy.git /tmp/bugsinpy-metadata
          PYTHONPATH=src python -m adaptive_llm_router.bugsinpy_reproduce \
            --dataset-root /tmp/bugsinpy-metadata \
            --workspace /tmp/bugsinpy-never-used-workspace \
            --output-root /tmp/bugsinpy-metadata-audit \
            --cases all
          python -c 'import json; a=json.load(open("/tmp/bugsinpy-metadata-audit/reproduction_summary.json")); assert a["executed"] is False and a["n_cases"] == 6 and a["verified_reproductions"] == 0'
      - name: Smoke-test full BugsInPy L2/L3 pipeline without paying or executing historical code
        run: |
          PYTHONPATH=src python -m adaptive_llm_router.bugsinpy_eval_pipeline \
            --case-id tqdm-6 \
            --dataset-root /tmp/bugsinpy-metadata \
            --workspace /tmp/bugsinpy-e2e-cpu-smoke \
            --evidence-file benchmarks/data/bugsinpy_six_historical_reproductions.json \
            --output-root /tmp/bugsinpy-e2e-cpu-results
          python -c 'import json; d=json.load(open("/tmp/bugsinpy-e2e-cpu-results/e2e_summary.json")); assert d["status"]=="dry_run_no_api_no_patch_tests" and d["comparison"]["status"]=="not_measured" and not d["paid_api_enabled"]'
      - name: Audit full original source and archived L3 diff without API or Docker
        run: |
          python scripts/audit_complete_source_context.py \
            --buggy-root /tmp/bugsinpy-e2e-cpu-smoke/source/checkouts/tqdm-6/buggy \
            --results /tmp/bugsinpy-e2e-cpu-results \
            --candidate tests/fixtures/run_40463547156_l3.diff
      - name: Save no-API source context and candidate applicability audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-context-audit-${{ github.run_id }}
          path: /tmp/bugsinpy-e2e-cpu-results/
          if-no-files-found: ignore
          retention-days: 14
